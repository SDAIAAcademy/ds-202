<section>
<h2>Day 1: Find and document the sources</h2>
<ol>
<li><p>Widad offers to add any register field to your extract. The headline is parcels per eligible household per month, by district. Which one do you ask her to include?</p><ul><li><b>A.</b> household_size, because eligibility is income per member</li><li><b>B.</b> national_id, to be sure of linking the right household</li><li><b>C.</b> phone, in case a household must be called to confirm</li><li><b>D.</b> every field, since unused columns can be dropped later</li></ul></li>
<li><p>You paged through an API and hold 5,137 records. The API reports a total of 5,125. What goes into the source inventory?</p><ul><li><b>A.</b> 5,137: it is what actually arrived</li><li><b>B.</b> 5,125: the API knows its own data</li><li><b>C.</b> 5,125 distinct ids, and a line that 12 repeats were dropped</li><li><b>D.</b> Either: twelve records cannot change the analysis</li></ul></li>
<li><p>You are writing the coverage field of the register record. Which line lets a stranger decide what the data can answer?</p><ul><li><b>A.</b> All households registered with the network</li><li><b>B.</b> Registrations 2021-01-03 to 2026-09-28; households that never registered are absent</li><li><b>C.</b> 40,000 rows, 11 columns, 4.4 MB</li><li><b>D.</b> Extract taken on 2026-10-04 from the register</li></ul></li>
<li><p>District D22 shows a healthy number of parcels per registered household, and its coverage is 0.34. What may the report say about D22?</p><ul><li><b>A.</b> D22 is well served and needs no attention</li><li><b>B.</b> Its true figure is the reported one multiplied by 0.34</li><li><b>C.</b> Nothing: with such coverage the district must be dropped</li><li><b>D.</b> Its registered households are served; most households in need are not registered</li></ul></li>
<li><p>An open table describes the year 2022, was published on 15 March 2023, and you downloaded it on 2 October 2026. Which date is the refresh date of your provenance record?</p><ul><li><b>A.</b> 2022, the year the data describe</li><li><b>B.</b> 15 March 2023, the day of publication</li><li><b>C.</b> 2 October 2026, the day your copy was taken</li><li><b>D.</b> Today, since the file is still on the portal</li></ul></li>
<li><p>Which owner field lets a stranger act on a provenance record a year from now?</p><ul><li><b>A.</b> "IT"</li><li><b>B.</b> "Widad"</li><li><b>C.</b> "See the shared drive"</li><li><b>D.</b> "Registration supervisor (Widad Al-Ghunaim); extracts approved by the data protection officer"</li></ul></li>
<li><p>You hold a register extract approved for "service coverage analysis, Q3 2026". A colleague asks you to use it to build a contact list for a fundraising campaign. What is the right step?</p><ul><li><b>A.</b> Use it: the extract is already on your computer</li><li><b>B.</b> Ask the data protection officer: the approval names another purpose</li><li><b>C.</b> Use it after removing the national ID numbers</li><li><b>D.</b> Refuse: an extract can never be used twice</li></ul></li>
<li><p>Which line belongs in the limits field of the record of the branch logs?</p><ul><li><b>A.</b> "A week can be uploaded twice or be missing, and no file says so"</li><li><b>B.</b> "The logs are in 14 files"</li><li><b>C.</b> "Hazem Al-Sulaim uploads them weekly"</li><li><b>D.</b> "The data are messy"</li></ul></li>
<li><p>A district shows 118% coverage: more registered households than the 2022 survey estimates as low-income. What goes into the report?</p><ul><li><b>A.</b> The register holds fabricated households in that district</li><li><b>B.</b> The coverage is capped at 100% to keep the table tidy</li><li><b>C.</b> The frame is a 2022 estimate and the district has grown; coverage ratios are approximate</li><li><b>D.</b> The district is dropped from the analysis</li></ul></li>
<li><p>The question is "parcels per eligible household per month, by district". Which set of register fields do you request?</p><ul><li><b>A.</b> Every field: unused columns can be dropped later</li><li><b>B.</b> household_id, district_id, registered_on, status, household_size, monthly_income_sar</li><li><b>C.</b> household_id and district_id only: everything else is personal</li><li><b>D.</b> national_id, head_name and district_id, to be sure who is who</li></ul></li>
</ol>
</section>
<section>
<h2>Day 2: Join and clean</h2>
<ol>
<li><p>The inventory of Day 1 shows 210,000 log rows from 14 files, and the logs state no total of their own. What does that line of the inventory allow you to say?</p><ul><li><b>A.</b> The logs are complete: 210,000 rows arrived</li><li><b>B.</b> 210,000 rows arrived; whether any are missing or doubled is unknown</li><li><b>C.</b> The logs are wrong: a round number is suspicious</li><li><b>D.</b> The logs cannot be used until the branches state totals</li></ul></li>
<li><p>A file was appended from several systems. Four loaders are proposed. Which one do you run?</p><ul><li><b>A.</b> Read it all as Windows-1256: it raises no error</li><li><b>B.</b> Read it as UTF-8 and replace undecodable bytes with a mark</li><li><b>C.</b> Let a detection library pick the encoding of the file</li><li><b>D.</b> Decode line by line, UTF-8 first, and count the lines of each encoding</li></ul></li>
<li><p>A left join of 209,620 log rows to the register returns 210,585 rows and no error. What is the first thing you check?</p><ul><li><b>A.</b> Whether household_id is unique in the register</li><li><b>B.</b> How many log keys have no match in the register</li><li><b>C.</b> Whether a branch file was loaded twice</li><li><b>D.</b> Nothing: drop duplicate rows from the result</li></ul></li>
<li><p>A false match credits one family with another's parcels. On labelled pairs: name ≥ 70 accepts 309 with 86 false; name ≥ 95 accepts 117 with 4 false; name and phone accepts 172 with 0 false. Which do you automate?</p><ul><li><b>A.</b> Name ≥ 70: it finds the most matches</li><li><b>B.</b> Name ≥ 95: 3.4% false is good enough</li><li><b>C.</b> Name and phone, with the rest sent to review</li><li><b>D.</b> None: match all 300 by hand</li></ul></li>
<li><p>A branch file holds 05/06/2026 and, further down, 09/27/2026. How do you read the first date?</p><ul><li><b>A.</b> 5 June: day first is the convention here</li><li><b>B.</b> 6 May: the file holds a second part above 12, so the month comes first</li><li><b>C.</b> It cannot be known: set it aside as ambiguous</li><li><b>D.</b> Either: let the date parser infer it</li></ul></li>
<li><p>You join 209,620 log rows to the register on household_id with a left join and get 210,585 rows. No error was raised. What happened?</p><ul><li><b>A.</b> Some log rows had no household in the register</li><li><b>B.</b> The join found households that the logs had missed</li><li><b>C.</b> Rounding in the row counter</li><li><b>D.</b> Some household ids are in the register more than once, so their handouts were repeated</li></ul></li>
<li><p>Which line makes the join itself fail when the register has a repeated household_id?</p><ul><li><b>A.</b> logs.merge(reg, on="household_id", how="left")</li><li><b>B.</b> logs.merge(reg, on="household_id", how="left", validate="many_to_one")</li><li><b>C.</b> logs.merge(reg, on="household_id", how="inner")</li><li><b>D.</b> logs.merge(reg, on="household_id", how="left").drop_duplicates()</li></ul></li>
<li><p>After key repair, 421 log rows carry a household id that is not in the register. What do you do with them?</p><ul><li><b>A.</b> Drop them silently: they cannot be analysed</li><li><b>B.</b> Assign them to the household with the most similar id</li><li><b>C.</b> Set them aside in a file with the reason, and count them in the join log</li><li><b>D.</b> Keep them in the joined table with blank household fields</li></ul></li>
<li><p>You match walk-in records to the register by name. At a low threshold you find more matches, and more of them are wrong. A false match gives one family the handouts of another. Which threshold do you choose?</p><ul><li><b>A.</b> The lowest: more matches means more complete data</li><li><b>B.</b> The one with the highest total number of matches on the labelled pairs</li><li><b>C.</b> The one a colleague used on another dataset</li><li><b>D.</b> One where false matches on labelled pairs are rare, accepting some missed matches for manual review</li></ul></li>
<li><p>Household ids are "H" and six digits. Some log rows hold "h482913", " H482913 " or "H-482913". Which repair is safe?</p><ul><li><b>A.</b> Strip spaces, upper-case and remove the hyphen, then check the result against the pattern</li><li><b>B.</b> Replace each odd id by the nearest valid id in the register</li><li><b>C.</b> Leave them: the join will ignore them</li><li><b>D.</b> Delete the rows, since hand-typed ids cannot be trusted</li></ul></li>
<li><p>A branch file holds dates such as 03/07/2026 and 11/04/2026. How do you decide whether the day or the month comes first?</p><ul><li><b>A.</b> Let the library guess each value</li><li><b>B.</b> Assume day first: it is the local habit</li><li><b>C.</b> Look at all values of that branch: a first part above 12 anywhere settles it for the whole file</li><li><b>D.</b> Drop every date whose two parts are both 12 or less</li></ul></li>
</ol>
</section>
<section>
<h2>Day 3: Missing data and measurement</h2>
<ol>
<li><p>After key repair, 732 log rows have no household: 421 carry an id that is not in the register and 311 are blank. What happens to them?</p><ul><li><b>A.</b> They drop out in the join; no action is needed</li><li><b>B.</b> Each gets the most similar id in the register</li><li><b>C.</b> They go to a set-aside file with a reason, and the join log counts them</li><li><b>D.</b> They stay in the joined table with blank household fields</li></ul></li>
<li><p>An online form offers household sizes 1 to 6; larger households leave the field blank. You compute the mean household size from the recorded values. Which line is right?</p><ul><li><b>A.</b> MAR, since it depends on the channel; the mean is unbiased</li><li><b>B.</b> MNAR, since the value decides; the mean is too low</li><li><b>C.</b> MCAR, since a form is not a person; the mean is unbiased</li><li><b>D.</b> MNAR, since the value decides; the mean is too high</li></ul></li>
<li><p>Sizes are blank mostly for large households, and branches hand out more parcels per visit to large households. Three estimates are on your desk. Which one do you present first, and why?</p><ul><li><b>A.</b> Complete case: it changes no value</li><li><b>B.</b> Median: simple and easy to explain</li><li><b>C.</b> The mean of the three, to be fair to each</li><li><b>D.</b> Within groups: it uses a recorded field related to the size</li></ul></li>
<li><p>District D17 comes out at 1.98 under one scenario for the blank sizes and at 2.01 under another. The standard is 2. What does the report say about D17?</p><ul><li><b>A.</b> It cannot be classified with these data; both values are shown</li><li><b>B.</b> Below the standard: 1.98 is the safe figure</li><li><b>C.</b> At the standard: the midpoint is 2.0</li><li><b>D.</b> It is left out until sizes are complete</li></ul></li>
<li><p>A few households just above the income line report one or two members more than they have, and so count as eligible. Branch desks hand out parcels by the family card. What happens to "parcels per eligible household"?</p><ul><li><b>A.</b> Nothing measurable: the errors are too few</li><li><b>B.</b> It rises: larger households receive more parcels</li><li><b>C.</b> It falls: they enter the denominator and collect almost nothing</li><li><b>D.</b> It cannot be said without verifying every household</li></ul></li>
<li><p>A branch scale was away for repair for two weeks, and every handout of those two weeks has no weight. Parcels were counted as usual. Which description fits the missing weights?</p><ul><li><b>A.</b> Missing because of the weight itself: heavy handouts were not recorded</li><li><b>B.</b> Missing at random given branch and date, both of which are recorded</li><li><b>C.</b> Not missing: a blank weight means the handout weighed nothing</li><li><b>D.</b> Missing completely at random across all branches and dates</li></ul></li>
<li><p>An online form offers household sizes 1 to 6. Larger households leave the field blank. An analyst computes the mean household size from the rows where it is recorded. What happens to that mean?</p><ul><li><b>A.</b> It is too low, because the blanks are the large households</li><li><b>B.</b> It is unbiased, because 82% of the rows are still there</li><li><b>C.</b> It is too high, because small households answer less often</li><li><b>D.</b> It is unbiased but less precise, as with any missing data</li></ul></li>
<li><p>Eligibility is income per member at most 1,000 SAR. An audit finds that a few households just above the line reported one or two members more than they have. What does this do to "parcels per eligible household"?</p><ul><li><b>A.</b> Nothing: a few wrong sizes average out over thousands of households</li><li><b>B.</b> It raises the figure, because larger households receive more parcels</li><li><b>C.</b> It lowers the figure: households counted as eligible that receive almost nothing enter the denominator</li><li><b>D.</b> It cannot be known without auditing every household</li></ul></li>
<li><p>Clerks sometimes mistype a household size by one, up as often as down, for any household. Which statement is right?</p><ul><li><b>A.</b> The mean size is roughly unchanged, but households near the eligibility line are misclassified in both directions</li><li><b>B.</b> The mean size rises, because larger numbers have more digits to mistype</li><li><b>C.</b> Nothing changes: symmetric errors cancel in every statistic</li><li><b>D.</b> The data must be discarded: any error makes the estimate meaningless</li></ul></li>
<li><p>One branch uploaded no log file for nine days in August. The households it serves show fewer parcels in the quarter than their neighbours. What is the right reading?</p><ul><li><b>A.</b> Those households were under-served in August</li><li><b>B.</b> Their figure is biased downwards by rows that are missing, and no field imputation repairs it</li><li><b>C.</b> Impute the mean number of parcels for the blank cells of those days</li><li><b>D.</b> The gap is completely at random, so only precision is lost</li></ul></li>
<li><p>Household size is missing for 18% of households, mostly large ones, and large households receive more parcels per visit. You drop the rows with no size. What happens to "parcels per eligible household"?</p><ul><li><b>A.</b> It is unchanged: dropping rows only shrinks the sample</li><li><b>B.</b> It rises, because fewer households share the parcels</li><li><b>C.</b> It falls, because the households that receive most were removed</li><li><b>D.</b> It becomes undefined</li></ul></li>
<li><p>You replace every missing household size by the median, 5. The missing households are mostly of size 7 or more. What is the main cost?</p><ul><li><b>A.</b> Nothing: the median is robust</li><li><b>B.</b> Large households are classified with a size of 5, so some truly eligible ones are counted as ineligible</li><li><b>C.</b> The median changes each time the code runs</li><li><b>D.</b> The dataset grows by 18%</li></ul></li>
<li><p>Branches hand out 1, 2 or 3 parcels per visit according to the family card. Which imputation of a missing household size uses that?</p><ul><li><b>A.</b> The overall mean size, 5.3</li><li><b>B.</b> A size drawn at random between 1 and 14</li><li><b>C.</b> Zero, to be conservative</li><li><b>D.</b> The typical size of households that receive the same number of parcels per visit</li></ul></li>
<li><p>Your best estimate is 2.06 parcels per eligible household per month. Under defensible assumptions about the missing sizes it ranges from 2.02 to 2.07, and the standard is 2.0. What do you report for the network as a whole?</p><ul><li><b>A.</b> 2.06, without the range: one number is clearer</li><li><b>B.</b> "About 2.06 (2.02 to 2.07 under different assumptions about missing sizes): at or above the standard"</li><li><b>C.</b> "Unknown", because 18% of sizes are missing</li><li><b>D.</b> 2.07, the most favourable value</li></ul></li>
<li><p>A district is at 1.97 under one imputation and 2.02 under another; the standard is 2.0. How does it appear in the report?</p><ul><li><b>A.</b> Below the standard: 1.97 is the cautious figure</li><li><b>B.</b> At the standard: 2.02 rounds to 2</li><li><b>C.</b> As "cannot be classified with these data", with both values</li><li><b>D.</b> It is left out of the table</li></ul></li>
</ol>
</section>
<section>
<h2>Day 4: Validate and protect</h2>
<ol>
<li><p>Complete cases give 1.985 parcels per eligible household per month; imputing within groups gives 2.060; the scenarios about the missing sizes run from 2.02 to 2.07. The standard is 2. What goes to Sumayyah?</p><ul><li><b>A.</b> 1.985: it uses only values that were recorded</li><li><b>B.</b> 2.060: it is the best estimate, so it is the answer</li><li><b>C.</b> 2.06, between 2.02 and 2.07, with the reason and the districts that stay below</li><li><b>D.</b> 2.02: the mean of the two methods, to be fair to both</li></ul></li>
<li><p>In the joined table, one row is one handout, and a household has many handouts. A week of one branch is uploaded twice. Which rule catches it?</p><ul><li><b>A.</b> Uniqueness of household_key</li><li><b>B.</b> Uniqueness of log_id</li><li><b>C.</b> Completeness of log_id</li><li><b>D.</b> Validity of handout_date</li></ul></li>
<li><p>From 7 to 9 August a branch writes dates as month/day/year; the build reads that branch as day/month/year. Every date parses, and every one falls inside the quarter. Which rule is most likely to show the fault?</p><ul><li><b>A.</b> Type: the date matches the pattern of the file</li><li><b>B.</b> Completeness: no date is missing</li><li><b>C.</b> Validity: the date is inside the quarter</li><li><b>D.</b> Consistency: rows per branch per day against that branch's usual pattern</li></ul></li>
<li><p>A table for a partner holds, per household: a keyed-hash pseudonym, the district, the exact registration date and the household size. The key is stored safely. What is the remaining risk, and the remedy?</p><ul><li><b>A.</b> The pseudonym can be enumerated; use a longer hash</li><li><b>B.</b> Date, district and size single households out; send the year and a size band</li><li><b>C.</b> None: without names and ID numbers the table is anonymous</li><li><b>D.</b> The pseudonym links tables; remove it and keep the other fields</li></ul></li>
<li><p>The build ran, every rule passed, and the estimate is 2.06 with a range of 2.02 to 2.07. Which sentence should open the limits section?</p><ul><li><b>A.</b> All rules passed, so the data is correct</li><li><b>B.</b> The data has some quality issues that should be kept in mind</li><li><b>C.</b> Size is missing for 18.1% of households; three districts are undecided</li><li><b>D.</b> The network delivers 2.060 parcels, above the standard</li></ul></li>
<li><p>A rule says "log_id never repeats". Which quality dimension does it test?</p><ul><li><b>A.</b> Completeness</li><li><b>B.</b> Validity</li><li><b>C.</b> Uniqueness</li><li><b>D.</b> Timeliness</li></ul></li>
<li><p>A rebuild stops with the message "AssertionError". Which message would let a branch supervisor fix the source?</p><ul><li><b>A.</b> "Validation failed in 3 checks"</li><li><b>B.</b> "Row 2,214 is invalid"</li><li><b>C.</b> "B05: 377 handouts weigh 21 to 32 kg per parcel; the standard is 9 to 15. Was the weight entered in pounds?"</li><li><b>D.</b> "weight_kg check returned False"</li></ul></li>
<li><p>Every column of a batch passes its own rule: dates are dates, parcels are 1 to 3, weights are 5 to 50. Yet 30 handouts are dated before the household registered. Which kind of rule catches them?</p><ul><li><b>A.</b> A stricter range on handout_date</li><li><b>B.</b> A rule across two fields: handout_date on or after registered_on</li><li><b>C.</b> A uniqueness rule on log_id</li><li><b>D.</b> No rule can: the values are all valid</li></ul></li>
<li><p>Why do the rules run on every rebuild and not once, when the dataset is first made?</p><ul><li><b>A.</b> Because the sources change: a branch can change its export next month</li><li><b>B.</b> Because rules slow the build, and a slow build is a careful one</li><li><b>C.</b> Because the first run of a rule is unreliable</li><li><b>D.</b> Because auditors count how many times rules were run</li></ul></li>
<li><p>You wrote a rule "weight_kg between 5 and 50" and it reports 4,000 failures on a build you believe is clean. What do you check first?</p><ul><li><b>A.</b> Delete the rule: it is clearly too strict</li><li><b>B.</b> Widen the range until nothing fails</li><li><b>C.</b> Set the rule to a warning and move on</li><li><b>D.</b> The failing rows and their branches: a real fault and a wrong rule look the same until you read examples</li></ul></li>
<li><p>A colleague replaces national ID numbers by their SHA-256 hash and calls the table anonymous. Someone holds a list of 40,000 ID numbers of residents. What can they do?</p><ul><li><b>A.</b> Nothing: a hash cannot be reversed</li><li><b>B.</b> Hash their list and look each value up in the table</li><li><b>C.</b> Only identify people whose number begins with the same digit</li><li><b>D.</b> Decrypt the hashes with the SHA-256 key</li></ul></li>
<li><p>What makes a keyed hash (HMAC) hold where a plain hash fails?</p><ul><li><b>A.</b> It is longer</li><li><b>B.</b> It uses a newer algorithm</li><li><b>C.</b> It cannot be recomputed without a key that is kept apart from the data</li><li><b>D.</b> It changes every time it is computed</li></ul></li>
<li><p>A table holds a keyed pseudonym, the district, the exact registration date and the household size. Is it still personal data?</p><ul><li><b>A.</b> No: there is no name and no ID number in it</li><li><b>B.</b> No: a keyed hash is anonymisation</li><li><b>C.</b> Only if the key is lost</li><li><b>D.</b> Yes: pseudonymised data remain personal, and the other fields together can single a household out</li></ul></li>
<li><p>Which repository shows that a dataset is rebuildable?</p><ul><li><b>A.</b> One that contains the final CSV and a notebook with saved outputs</li><li><b>B.</b> One with a README describing each manual step in order</li><li><b>C.</b> One whose single command turns the raw files into the dataset, its join log and its rule results</li><li><b>D.</b> One with the raw personal data committed for convenience</li></ul></li>
</ol>
</section>

bel":"Session 1","title":"Encodings and Arabic text"},{"n":2,"label":"Session 2","title":"Keys and cardinality"},{"n":3,"label":"Session 3","title":"Matching without a clean key"},{"n":4,"label":"Session 4","title":"Types, units and dates"}]},{"n":3,"id":"day3","label":"Day 3","title":"Missing data and measurement","sessions":[{"n":1,"label":"Session 1","title":"Why data go missing"},{"n":2,"label":"Session 2","title":"Imputation and its cost"},{"n":3,"label":"Session 3","title":"Sensitivity ranges"},{"n":4,"label":"Session 4","title":"Measurement error and proxies"}]},{"n":4,"id":"day4","label":"Day 4","title":"Validate and protect","sessions":[{"n":1,"label":"Session 1","title":"Quality dimensions as rules"},{"n":2,"label":"Session 2","title":"Cross-field and cross-source checks"},{"n":3,"label":"Session 3","title":"Minimise and pseudonymise"},{"n":4,"label":"Session 4","title":"A data-quality report"}]},{"n":5,"id":"capstone","label":"Capstone","title":"Capstone project presentations","sessions":[]}]},"ai":{"context":{"course":"context/course.md","courseJs":"context/course.js","day":null,"llms":"llms.txt"},"tasks":[],"tools":[]},"features":{},"strings":{},"questions":[{"id":"check-question-q1","type":"single","prompt":"Widad offers to add any register field to your extract. The headline is parcels per eligible household per month, by district. Which one do you ask her to include?","options":[{"key":"A","text":"household_size, because eligibility is income per member"},{"key":"B","text":"national_id, to be sure of linking the right household"},{"key":"C","text":"phone, in case a household must be called to confirm"},{"key":"D","text":"every field, since unused columns can be dropped later"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"A field is needed when a step of the answer cannot be computed without it. Size is personal data and it is needed; the ID number is personal data and it is not.","misconceptions":["","Takes an identifier as a safer link, when household_id already joins the sources and the question names nobody","Collects for a possible later use; the approval names one purpose and nobody is contacted in it","Believes more columns make a safer dataset; every field taken must be justified by a step of the answer"],"lo":["LO6"],"day":1,"session":1,"slide":{"deck":"day1","id":"check-question","title":"Which field do you ask for?"},"level":null,"pool":"checkpoint"},{"id":"check-total-q1","type":"single","prompt":"You paged through an API and hold 5,137 records. The API reports a total of 5,125. What goes into the source inventory?","options":[{"key":"A","text":"5,137: it is what actually arrived"},{"key":"B","text":"5,125: the API knows its own data"},{"key":"C","text":"5,125 distinct ids, and a line that 12 repeats were dropped"},{"key":"D","text":"Either: twelve records cannot change the analysis"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"The inventory has to explain the difference, not hide it: what arrived, what was dropped and why, and that the result equals the total the source reports.","misconceptions":["Trusts the larger number as the more complete one, without asking where 12 extra records came from","Copies the claim of the source without checking that the records held can produce it","","Treats a difference of 0.2% as noise, when each record is a whole delivery of food"],"lo":["LO3"],"day":1,"session":2,"slide":{"deck":"day1","id":"check-total","title":"Your count and the count of the source disagree"},"level":null,"pool":"checkpoint"},{"id":"check-provenance-q1","type":"single","prompt":"You are writing the coverage field of the register record. Which line lets a stranger decide what the data can answer?","options":[{"key":"A","text":"All households registered with the network"},{"key":"B","text":"Registrations 2021-01-03 to 2026-09-28; households that never registered are absent"},{"key":"C","text":"40,000 rows, 11 columns, 4.4 MB"},{"key":"D","text":"Extract taken on 2026-10-04 from the register"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Coverage says which units and which period, and names who is not in it. The absent households are the most important part of the line.","misconceptions":["Describes the system and not the copy: the reader cannot tell which period the extract holds","","Confuses the size of the file with what it covers: a row count says nothing about who is missing","States the refresh date in the coverage field: the day of the copy is not the period it covers"],"lo":["LO2"],"day":1,"session":3,"slide":{"deck":"day1","id":"check-provenance","title":"Which coverage line passes a reviewer?"},"level":null,"pool":"checkpoint"},{"id":"check-coverage-q1","type":"single","prompt":"District D22 shows a healthy number of parcels per registered household, and its coverage is 0.34. What may the report say about D22?","options":[{"key":"A","text":"D22 is well served and needs no attention"},{"key":"B","text":"Its true figure is the reported one multiplied by 0.34"},{"key":"C","text":"Nothing: with such coverage the district must be dropped"},{"key":"D","text":"Its registered households are served; most households in need are not registered"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"The data speak for the households they contain. The coverage ratio says how many they do not contain, and that sentence sits beside the figure.","misconceptions":["Lets the registered third stand for everyone, when two thirds of the estimated households are in no file","Corrects the figure with a frame that is itself a rough 2022 estimate, and presents the product as a measurement","Discards a real finding about real households because the data do not answer a larger question",""],"lo":["LO1"],"day":1,"session":4,"slide":{"deck":"day1","id":"check-coverage","title":"A district that looks well served"},"level":null,"pool":"checkpoint"},{"id":"review-day-1-q1","type":"single","prompt":"The inventory of Day 1 shows 210,000 log rows from 14 files, and the logs state no total of their own. What does that line of the inventory allow you to say?","options":[{"key":"A","text":"The logs are complete: 210,000 rows arrived"},{"key":"B","text":"210,000 rows arrived; whether any are missing or doubled is unknown"},{"key":"C","text":"The logs are wrong: a round number is suspicious"},{"key":"D","text":"The logs cannot be used until the branches state totals"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"A count with nothing to reconcile against is a fact about what arrived, not about what happened. Today finds a week that arrived twice; Day 3 finds days that never arrived.","misconceptions":["Takes the absence of a contradiction for a confirmation; nothing was compared","","Believes a large round number signals an error by itself","Discards a source for lacking metadata instead of recording the limit and testing for it"],"lo":["LO2"],"day":2,"session":null,"slide":{"deck":"day2","id":"review-day-1","title":"A count that nobody can check"},"level":null,"pool":"checkpoint"},{"id":"check-encoding-q1","type":"single","prompt":"A file was appended from several systems. Four loaders are proposed. Which one do you run?","options":[{"key":"A","text":"Read it all as Windows-1256: it raises no error"},{"key":"B","text":"Read it as UTF-8 and replace undecodable bytes with a mark"},{"key":"C","text":"Let a detection library pick the encoding of the file"},{"key":"D","text":"Decode line by line, UTF-8 first, and count the lines of each encoding"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"The file has no single encoding, so the decision has to be made where the encoding changes, per line, and the count per encoding is the check on the decision.","misconceptions":["Believes the absence of an error proves a correct reading; this code page accepts every byte","Keeps the file loading by throwing away the bytes that carry the names","Lets a library guess one encoding for a file that has several",""],"lo":["LO6"],"day":2,"session":1,"slide":{"deck":"day2","id":"check-encoding","title":"Which loader do you trust?"},"level":null,"pool":"checkpoint"},{"id":"check-join-q1","type":"single","prompt":"A left join of 209,620 log rows to the register returns 210,585 rows and no error. What is the first thing you check?","options":[{"key":"A","text":"Whether household_id is unique in the register"},{"key":"B","text":"How many log keys have no match in the register"},{"key":"C","text":"Whether a branch file was loaded twice"},{"key":"D","text":"Nothing: drop duplicate rows from the result"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Only a key that matches several rows on the right can add rows to a left join. Test uniqueness on the right before joining, and the join cannot surprise you.","misconceptions":["","Looks for unmatched keys, which leave the row count of a left join unchanged","Suspects the reader, when the two tables had their expected sizes before the join","Removes the symptom after the join; the repeated rows differ in register columns and stay"],"lo":["LO3"],"day":2,"session":2,"slide":{"deck":"day2","id":"check-join","title":"More rows out than in"},"level":null,"pool":"checkpoint"},{"id":"check-threshold-q1","type":"single","prompt":"A false match credits one family with another's parcels. On labelled pairs: name ≥ 70 accepts 309 with 86 false; name ≥ 95 accepts 117 with 4 false; name and phone accepts 172 with 0 false. Which do you automate?","options":[{"key":"A","text":"Name ≥ 70: it finds the most matches"},{"key":"B","text":"Name ≥ 95: 3.4% false is good enough"},{"key":"C","text":"Name and phone, with the rest sent to review"},{"key":"D","text":"None: match all 300 by hand"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"The costly error decides. Automate the rule that did not make it on labelled pairs, and spend human time on the records the rule leaves.","misconceptions":["Counts matches found, not matches that are right: more than one in four would be wrong","Accepts a small rate of the costly error when a rule without it exists","","Gives up automation entirely, although a rule with no false match on labelled pairs handles most records"],"lo":["LO3"],"day":2,"session":3,"slide":{"deck":"day2","id":"check-threshold","title":"Which rule goes into the build?"},"level":null,"pool":"checkpoint"},{"id":"check-date-q1","type":"single","prompt":"A branch file holds 05/06/2026 and, further down, 09/27/2026. How do you read the first date?","options":[{"key":"A","text":"5 June: day first is the convention here"},{"key":"B","text":"6 May: the file holds a second part above 12, so the month comes first"},{"key":"C","text":"It cannot be known: set it aside as ambiguous"},{"key":"D","text":"Either: let the date parser infer it"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"27 cannot be a month, so in this file the second part is the day, for every row. The evidence is in the source, not in the value.","misconceptions":["Applies the local habit to a file whose own rows contradict it","","Treats each value alone and discards what the rest of the file says","Lets a library decide value by value, which can read one file both ways"],"lo":["LO6"],"day":2,"session":4,"slide":{"deck":"day2","id":"check-date","title":"A date that could be two days"},"level":null,"pool":"checkpoint"},{"id":"review-day-2-q1","type":"single","prompt":"After key repair, 732 log rows have no household: 421 carry an id that is not in the register and 311 are blank. What happens to them?","options":[{"key":"A","text":"They drop out in the join; no action is needed"},{"key":"B","text":"Each gets the most similar id in the register"},{"key":"C","text":"They go to a set-aside file with a reason, and the join log counts them"},{"key":"D","text":"They stay in the joined table with blank household fields"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Rows in equal rows out plus rows set aside: 210,000 = 380 + 732 + 208,888. A set-aside row keeps its reason so the branch can repair the key.","misconceptions":["Lets an inner join remove them without a trace, so the join log no longer adds up","Invents a link from similarity; a wrong household gains parcels it never received","","Keeps rows without a household in the table, where they enter totals but no district"],"lo":["LO3"],"day":3,"session":null,"slide":{"deck":"day3","id":"review-day-2","title":"Rows that could not be joined"},"level":null,"pool":"checkpoint"},{"id":"check-mechanism-q1","type":"single","prompt":"An online form offers household sizes 1 to 6; larger households leave the field blank. You compute the mean household size from the recorded values. Which line is right?","options":[{"key":"A","text":"MAR, since it depends on the channel; the mean is unbiased"},{"key":"B","text":"MNAR, since the value decides; the mean is too low"},{"key":"C","text":"MCAR, since a form is not a person; the mean is unbiased"},{"key":"D","text":"MNAR, since the value decides; the mean is too high"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Above 6 the size cannot be entered: whether it is blank depends on the size itself. The recorded sizes are a selection of the small ones.","misconceptions":["Stops at the visible pattern (the channel) and misses that within the channel the value decides","","Believes any gap that a form causes is random with respect to the data","Gets the mechanism and reverses the direction: the large values are the ones removed"],"lo":["LO1"],"day":3,"session":1,"slide":{"deck":"day3","id":"check-mechanism","title":"Name the mechanism"},"level":null,"pool":"checkpoint"},{"id":"check-imputation-q1","type":"single","prompt":"Sizes are blank mostly for large households, and branches hand out more parcels per visit to large households. Three estimates are on your desk. Which one do you present first, and why?","options":[{"key":"A","text":"Complete case: it changes no value"},{"key":"B","text":"Median: simple and easy to explain"},{"key":"C","text":"The mean of the three, to be fair to each"},{"key":"D","text":"Within groups: it uses a recorded field related to the size"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"A method earns first place by its assumption, not by its result: within a parcels group, blank and recorded households are plausibly alike. The other estimates stay in the table.","misconceptions":["Believes leaving the data untouched means making no assumption","Chooses by simplicity; one size for all misclassifies exactly the large households","Averages three answers as if their errors were unrelated; two of them err in the same direction",""],"lo":["LO5"],"day":3,"session":2,"slide":{"deck":"day3","id":"check-imputation","title":"Which estimate do you put first?"},"level":null,"pool":"checkpoint"},{"id":"check-range-q1","type":"single","prompt":"District D17 comes out at 1.98 under one scenario for the blank sizes and at 2.01 under another. The standard is 2. What does the report say about D17?","options":[{"key":"A","text":"It cannot be classified with these data; both values are shown"},{"key":"B","text":"Below the standard: 1.98 is the safe figure"},{"key":"C","text":"At the standard: the midpoint is 2.0"},{"key":"D","text":"It is left out until sizes are complete"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"When the side of the line depends on the assumption, the honest verdict is \"undecided\", with the values. Acting on one of them is acting on an artefact of the imputation.","misconceptions":["","Presents one assumption as the finding because it is the cautious-looking one","Averages two scenarios as if they were two measurements of the same thing","Removes from the table exactly the district where the uncertainty matters"],"lo":["LO5"],"day":3,"session":3,"slide":{"deck":"day3","id":"check-range","title":"What do you report for the district?"},"level":null,"pool":"checkpoint"},{"id":"check-direction-q1","type":"single","prompt":"A few households just above the income line report one or two members more than they have, and so count as eligible. Branch desks hand out parcels by the family card. What happens to \"parcels per eligible household\"?","options":[{"key":"A","text":"Nothing measurable: the errors are too few"},{"key":"B","text":"It rises: larger households receive more parcels"},{"key":"C","text":"It falls: they enter the denominator and collect almost nothing"},{"key":"D","text":"It cannot be said without verifying every household"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"The error is in one direction and at the threshold: it adds households to the eligible group that the desk does not serve, so the average per eligible household goes down.","misconceptions":["Expects a few errors among thousands to average out, as random errors would","Follows the reported size to the parcels, although handouts follow the family card","","Believes direction cannot be reasoned from the mechanism without a full audit"],"lo":["LO1"],"day":3,"session":4,"slide":{"deck":"day3","id":"check-direction","title":"Which way does the headline move?"},"level":null,"pool":"checkpoint"},{"id":"review-day-3-q1","type":"single","prompt":"Complete cases give 1.985 parcels per eligible household per month; imputing within groups gives 2.060; the scenarios about the missing sizes run from 2.02 to 2.07. The standard is 2. What goes to Sumayyah?","options":[{"key":"A","text":"1.985: it uses only values that were recorded"},{"key":"B","text":"2.060: it is the best estimate, so it is the answer"},{"key":"C","text":"2.06, between 2.02 and 2.07, with the reason and the districts that stay below"},{"key":"D","text":"2.02: the mean of the two methods, to be fair to both"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"The audit showed that blank sizes are large sizes, so complete cases are biased low. The range says how far the remaining assumption can move the figure.","misconceptions":["Treats dropping rows as the method that assumes nothing, although the dropped households are the larger ones","Reports the best single estimate and hides that it rests on an assumption about 18% of the households","","Averages methods as if each were an equally good measurement of the same thing"],"lo":["LO5"],"day":4,"session":null,"slide":{"deck":"day4","id":"review-day-3","title":"One number, or a number with a range"},"level":null,"pool":"checkpoint"},{"id":"check-dimension-q1","type":"single","prompt":"In the joined table, one row is one handout, and a household has many handouts. A week of one branch is uploaded twice. Which rule catches it?","options":[{"key":"A","text":"Uniqueness of household_key"},{"key":"B","text":"Uniqueness of log_id"},{"key":"C","text":"Completeness of log_id"},{"key":"D","text":"Validity of handout_date"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Uniqueness belongs to the key of the grain. The grain here is the handout, so its key, log_id, must never repeat.","misconceptions":["Puts uniqueness on a column that repeats by design: every household with two handouts would fail","","Looks for blanks, although a row uploaded twice is complete in every field","Checks each value alone; a repeated row has the same valid values as the first copy"],"lo":["LO4"],"day":4,"session":1,"slide":{"deck":"day4","id":"check-dimension","title":"Which rule, and which dimension?"},"level":null,"pool":"checkpoint"},{"id":"check-cross-field-q1","type":"single","prompt":"From 7 to 9 August a branch writes dates as month/day/year; the build reads that branch as day/month/year. Every date parses, and every one falls inside the quarter. Which rule is most likely to show the fault?","options":[{"key":"A","text":"Type: the date matches the pattern of the file"},{"key":"B","text":"Completeness: no date is missing"},{"key":"C","text":"Validity: the date is inside the quarter"},{"key":"D","text":"Consistency: rows per branch per day against that branch's usual pattern"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"Each swapped date is a possible date. The fault shows only in a relation: the branch has no rows on 7 and 9 August, and about twice its usual rows on 8 July and 8 September.","misconceptions":["Tests the layout of the text; a swapped day and month has the same layout","Looks for blanks, although every date is present","Checks each date alone against the quarter; every swapped date is inside it",""],"lo":["LO4"],"day":4,"session":2,"slide":{"deck":"day4","id":"check-cross-field","title":"Which rule finds it?"},"level":null,"pool":"checkpoint"},{"id":"check-pseudonym-q1","type":"single","prompt":"A table for a partner holds, per household: a keyed-hash pseudonym, the district, the exact registration date and the household size. The key is stored safely. What is the remaining risk, and the remedy?","options":[{"key":"A","text":"The pseudonym can be enumerated; use a longer hash"},{"key":"B","text":"Date, district and size single households out; send the year and a size band"},{"key":"C","text":"None: without names and ID numbers the table is anonymous"},{"key":"D","text":"The pseudonym links tables; remove it and keep the other fields"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"With exact fields, 92.8% of households have a combination nobody else has. Generalising the date and the size brings that to almost none and costs the purpose nothing.","misconceptions":["Believes a keyed hash can be broken like a plain one; without the key no candidate can be tested","","Takes the absence of names and numbers for anonymity, and ignores what the other fields reveal together","Removes the one field the partner needs to count shared households, and leaves the identifying ones"],"lo":["LO6"],"day":4,"session":3,"slide":{"deck":"day4","id":"check-pseudonym","title":"What must change before the table is sent?"},"level":null,"pool":"checkpoint"},{"id":"check-report-q1","type":"single","prompt":"The build ran, every rule passed, and the estimate is 2.06 with a range of 2.02 to 2.07. Which sentence should open the limits section?","options":[{"key":"A","text":"All rules passed, so the data is correct"},{"key":"B","text":"The data has some quality issues that should be kept in mind"},{"key":"C","text":"Size is missing for 18.1% of households; three districts are undecided"},{"key":"D","text":"The network delivers 2.060 parcels, above the standard"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"A limit names the fault, its size and what it does to the reader's decision. Here: for D09, D17 and D24 no verdict against the standard can be given.","misconceptions":["Reads passing rules as proof of truth, although rules test what a value may be","Is true of every dataset and gives the reader nothing to act on","","Hides the assumption behind a precise figure and drops the range that was computed"],"lo":["LO6"],"day":4,"session":4,"slide":{"deck":"day4","id":"check-report","title":"Which sentence belongs in the report?"},"level":null,"pool":"checkpoint"},{"id":"q-lo1-clinic-weights","type":"single","prompt":"A branch scale was away for repair for two weeks, and every handout of those two weeks has no weight. Parcels were counted as usual. Which description fits the missing weights?","options":[{"key":"A","text":"Missing because of the weight itself: heavy handouts were not recorded"},{"key":"B","text":"Missing at random given branch and date, both of which are recorded"},{"key":"C","text":"Not missing: a blank weight means the handout weighed nothing"},{"key":"D","text":"Missing completely at random across all branches and dates"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"The blanks are explained by two recorded fields, the branch and the date; within that branch and fortnight nothing about the weight decided whether it was recorded.","misconceptions":["Assumes every gap depends on the hidden value; here the cause is a known date range at one branch","","Reads a blank as a zero, which would lower every average of weight","Ignores that the blanks sit in one branch and one fortnight, which the data show"],"lo":["LO1"],"day":3,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"q-lo1-dropdown","type":"single","prompt":"An online form offers household sizes 1 to 6. Larger households leave the field blank. An analyst computes the mean household size from the rows where it is recorded. What happens to that mean?","options":[{"key":"A","text":"It is too low, because the blanks are the large households"},{"key":"B","text":"It is unbiased, because 82% of the rows are still there"},{"key":"C","text":"It is too high, because small households answer less often"},{"key":"D","text":"It is unbiased but less precise, as with any missing data"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"The value itself decides whether it is missing (above 6 cannot be entered), so the recorded sizes are a selection of the small ones and their mean is too low.","misconceptions":["","Believes a large share of observed rows guarantees a fair picture, whatever the reason for the blanks","Reverses the mechanism: the form stops the large households from answering, not the small ones","Treats every gap as completely at random, where only precision is lost"],"lo":["LO1"],"day":3,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"q-lo1-over-report","type":"single","prompt":"Eligibility is income per member at most 1,000 SAR. An audit finds that a few households just above the line reported one or two members more than they have. What does this do to \"parcels per eligible household\"?","options":[{"key":"A","text":"Nothing: a few wrong sizes average out over thousands of households"},{"key":"B","text":"It raises the figure, because larger households receive more parcels"},{"key":"C","text":"It lowers the figure: households counted as eligible that receive almost nothing enter the denominator"},{"key":"D","text":"It cannot be known without auditing every household"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Over-reporting moves ineligible households into the denominator; they collect few parcels, so the average per eligible household falls.","misconceptions":["Expects errors to cancel, which holds for random error and not for error in one direction at a threshold","Follows the reported size to the parcels, although the branch desk hands out by the family card, not by the register","","Believes direction needs a census; the mechanism alone gives the direction, and a sample gives the size"],"lo":["LO1"],"day":3,"session":4,"slide":null,"level":"analyze","pool":"practice"},{"id":"q-lo1-random-error","type":"single","prompt":"Clerks sometimes mistype a household size by one, up as often as down, for any household. Which statement is right?","options":[{"key":"A","text":"The mean size is roughly unchanged, but households near the eligibility line are misclassified in both directions"},{"key":"B","text":"The mean size rises, because larger numbers have more digits to mistype"},{"key":"C","text":"Nothing changes: symmetric errors cancel in every statistic"},{"key":"D","text":"The data must be discarded: any error makes the estimate meaningless"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Random error leaves averages about right but adds noise to any yes-or-no rule at a threshold, which usually weakens differences between groups.","misconceptions":["","Invents a direction for an error that is symmetric by description","Extends cancelling in a mean to a threshold rule, where each error can flip a household","Treats all error as fatal instead of asking how far it moves the result"],"lo":["LO1"],"day":3,"session":4,"slide":null,"level":"understand","pool":"practice"},{"id":"q-lo1-gap-days","type":"single","prompt":"One branch uploaded no log file for nine days in August. The households it serves show fewer parcels in the quarter than their neighbours. What is the right reading?","options":[{"key":"A","text":"Those households were under-served in August"},{"key":"B","text":"Their figure is biased downwards by rows that are missing, and no field imputation repairs it"},{"key":"C","text":"Impute the mean number of parcels for the blank cells of those days"},{"key":"D","text":"The gap is completely at random, so only precision is lost"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Whole rows are missing for a known branch and period: the count for its districts is too low, and the remedy is to ask the owner for the file or to report the gap beside the figure.","misconceptions":["Takes missing rows for missing service; the handouts may have happened and never reached a file","","Looks for blank cells to fill; there are none, because whole rows are absent","Ignores that the gap sits in one branch and so lowers the figure of its districts in particular"],"lo":["LO1"],"day":3,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"q-lo2-refresh-date","type":"single","prompt":"An open table describes the year 2022, was published on 15 March 2023, and you downloaded it on 2 October 2026. Which date is the refresh date of your provenance record?","options":[{"key":"A","text":"2022, the year the data describe"},{"key":"B","text":"15 March 2023, the day of publication"},{"key":"C","text":"2 October 2026, the day your copy was taken"},{"key":"D","text":"Today, since the file is still on the portal"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"The refresh date is the day your copy was taken; the reference year goes into coverage and the gap between them into limits.","misconceptions":["Confuses the reference period, which belongs in coverage, with the age of the copy","Takes the release date of the publisher for the day the copy was taken","","Assumes the copy follows the portal; a downloaded file does not update itself"],"lo":["LO2"],"day":1,"session":3,"slide":null,"level":"apply","pool":"practice"},{"id":"q-lo2-owner","type":"single","prompt":"Which owner field lets a stranger act on a provenance record a year from now?","options":[{"key":"A","text":"\"IT\""},{"key":"B","text":"\"Widad\""},{"key":"C","text":"\"See the shared drive\""},{"key":"D","text":"\"Registration supervisor (Widad Al-Ghunaim); extracts approved by the data protection officer\""}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"An owner is a role that will still exist when the person has moved on, with the name of who holds it now and who approves access.","misconceptions":["Names a department that cannot answer what a column means","Uses a first name that means nothing to a reader outside the team","Points to a place, not to a person or role who answers for the data",""],"lo":["LO2"],"day":1,"session":3,"slide":null,"level":"apply","pool":"practice"},{"id":"q-lo2-purpose","type":"single","prompt":"You hold a register extract approved for \"service coverage analysis, Q3 2026\". A colleague asks you to use it to build a contact list for a fundraising campaign. What is the right step?","options":[{"key":"A","text":"Use it: the extract is already on your computer"},{"key":"B","text":"Ask the data protection officer: the approval names another purpose"},{"key":"C","text":"Use it after removing the national ID numbers"},{"key":"D","text":"Refuse: an extract can never be used twice"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"The sharing basis names a purpose; a new purpose is a new decision by whoever approved the sharing, not by the analyst who holds the file.","misconceptions":["Treats possession as permission","","Believes dropping one identifier changes the purpose the data were shared for","Turns a purpose limit into an absolute ban; a new approval may be given"],"lo":["LO2"],"day":1,"session":3,"slide":null,"level":"analyze","pool":"practice"},{"id":"q-lo2-limits","type":"single","prompt":"Which line belongs in the limits field of the record of the branch logs?","options":[{"key":"A","text":"\"A week can be uploaded twice or be missing, and no file says so\""},{"key":"B","text":"\"The logs are in 14 files\""},{"key":"C","text":"\"Hazem Al-Sulaim uploads them weekly\""},{"key":"D","text":"\"The data are messy\""}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"A limit is a specific thing the data cannot be trusted for, stated so that the next analyst can test for it.","misconceptions":["","Describes the form of the extract, which belongs in origin","Names the owner and the routine, not what the data cannot be trusted for","States a mood, not a fact a reader can check or plan around"],"lo":["LO2"],"day":1,"session":3,"slide":null,"level":"apply","pool":"practice"},{"id":"q-lo2-coverage-frame","type":"single","prompt":"A district shows 118% coverage: more registered households than the 2022 survey estimates as low-income. What goes into the report?","options":[{"key":"A","text":"The register holds fabricated households in that district"},{"key":"B","text":"The coverage is capped at 100% to keep the table tidy"},{"key":"C","text":"The frame is a 2022 estimate and the district has grown; coverage ratios are approximate"},{"key":"D","text":"The district is dropped from the analysis"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"A ratio above one tells you about the age and error of the frame, and that caveat applies to every district, not only to the one where it shows.","misconceptions":["Reads the ratio as a fact about the numerator when the denominator is the old estimate","Hides the evidence that the frame is out of date","","Removes real households because an outside estimate is imperfect"],"lo":["LO2"],"day":1,"session":4,"slide":null,"level":"analyze","pool":"practice"},{"id":"q-lo3-fan-out","type":"single","prompt":"You join 209,620 log rows to the register on household_id with a left join and get 210,585 rows. No error was raised. What happened?","options":[{"key":"A","text":"Some log rows had no household in the register"},{"key":"B","text":"The join found households that the logs had missed"},{"key":"C","text":"Rounding in the row counter"},{"key":"D","text":"Some household ids are in the register more than once, so their handouts were repeated"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"A left join returns more rows than its left table only when a key matches several rows on the right: the register is not one row per id.","misconceptions":["Expects unmatched rows to add rows; in a left join they stay one row each","Believes a join can discover records; it only repeats or matches the rows it is given","Treats a whole-row difference as noise",""],"lo":["LO3"],"day":2,"session":2,"slide":null,"level":"apply","pool":"practice"},{"id":"q-lo3-validate","type":"single","prompt":"Which line makes the join itself fail when the register has a repeated household_id?","options":[{"key":"A","text":"logs.merge(reg, on=\"household_id\", how=\"left\")"},{"key":"B","text":"logs.merge(reg, on=\"household_id\", how=\"left\", validate=\"many_to_one\")"},{"key":"C","text":"logs.merge(reg, on=\"household_id\", how=\"inner\")"},{"key":"D","text":"logs.merge(reg, on=\"household_id\", how=\"left\").drop_duplicates()"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"validate=\"many_to_one\" checks that the key is unique in the right table and raises an error before any row is produced.","misconceptions":["Assumes a left join protects the row count; it does not check the right table","","Believes an inner join removes duplicates; it repeats them just the same","Removes exact copies afterwards, but the repeated rows differ in the register columns"],"lo":["LO3"],"day":2,"session":2,"slide":null,"level":"apply","pool":"practice"},{"id":"q-lo3-set-aside","type":"single","prompt":"After key repair, 421 log rows carry a household id that is not in the register. What do you do with them?","options":[{"key":"A","text":"Drop them silently: they cannot be analysed"},{"key":"B","text":"Assign them to the household with the most similar id"},{"key":"C","text":"Set them aside in a file with the reason, and count them in the join log"},{"key":"D","text":"Keep them in the joined table with blank household fields"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Rows in must equal rows out plus rows set aside; each set-aside row keeps its reason so the owner can repair the source.","misconceptions":["Loses rows without a trace, so the counts no longer add up","Invents a link; a wrong household then gains parcels it never received","","Lets rows without a household flow into every later average and group"],"lo":["LO3"],"day":2,"session":2,"slide":null,"level":"analyze","pool":"practice"},{"id":"q-lo3-threshold","type":"single","prompt":"You match walk-in records to the register by name. At a low threshold you find more matches, and more of them are wrong. A false match gives one family the handouts of another. Which threshold do you choose?","options":[{"key":"A","text":"The lowest: more matches means more complete data"},{"key":"B","text":"The one with the highest total number of matches on the labelled pairs"},{"key":"C","text":"The one a colleague used on another dataset"},{"key":"D","text":"One where false matches on labelled pairs are rare, accepting some missed matches for manual review"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"The two errors do not cost the same: a missed match can be reviewed by hand, a false match silently corrupts two households.","misconceptions":["Counts matches without asking whether they are right","Optimises volume, where the cost of a false match is what matters","Assumes a threshold transfers between datasets with different names and typing habits",""],"lo":["LO3"],"day":2,"session":3,"slide":null,"level":"analyze","pool":"practice"},{"id":"q-lo3-key-repair","type":"single","prompt":"Household ids are \"H\" and six digits. Some log rows hold \"h482913\", \" H482913 \" or \"H-482913\". Which repair is safe?","options":[{"key":"A","text":"Strip spaces, upper-case and remove the hyphen, then check the result against the pattern"},{"key":"B","text":"Replace each odd id by the nearest valid id in the register"},{"key":"C","text":"Leave them: the join will ignore them"},{"key":"D","text":"Delete the rows, since hand-typed ids cannot be trusted"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"A repair is safe when the rule cannot change which household is meant: case, spaces and a hyphen carry no information; \"nearest id\" does.","misconceptions":["","Changes which household a row belongs to on the strength of similarity alone","Accepts losing rows that a rule can repair with certainty","Discards rows whose meaning is unambiguous"],"lo":["LO3"],"day":2,"session":2,"slide":null,"level":"apply","pool":"practice"},{"id":"q-lo4-dimension","type":"single","prompt":"A rule says \"log_id never repeats\". Which quality dimension does it test?","options":[{"key":"A","text":"Completeness"},{"key":"B","text":"Validity"},{"key":"C","text":"Uniqueness"},{"key":"D","text":"Timeliness"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Uniqueness rules say that a key identifies one row; a week uploaded twice breaks exactly this rule.","misconceptions":["Confuses \"every row is there once\" with \"no value is blank\"","Takes any rule about a column for a rule about its allowed values","","Picks a dimension that concerns when data arrive, not whether rows repeat"],"lo":["LO4"],"day":4,"session":1,"slide":null,"level":"understand","pool":"practice"},{"id":"q-lo4-readable","type":"single","prompt":"A rebuild stops with the message \"AssertionError\". Which message would let a branch supervisor fix the source?","options":[{"key":"A","text":"\"Validation failed in 3 checks\""},{"key":"B","text":"\"Row 2,214 is invalid\""},{"key":"C","text":"\"B05: 377 handouts weigh 21 to 32 kg per parcel; the standard is 9 to 15. Was the weight entered in pounds?\""},{"key":"D","text":"\"weight_kg check returned False\""}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"A readable failure names the rule in plain words, the owner of the rows, how many rows and an example, so the person who can fix the source knows what to look at.","misconceptions":["Counts failures without saying where or what","Points to a row number of your table, which means nothing in the file of the branch","","Names the column but not the branch, the values or the likely cause"],"lo":["LO4"],"day":4,"session":2,"slide":null,"level":"apply","pool":"practice"},{"id":"q-lo4-cross-field","type":"single","prompt":"Every column of a batch passes its own rule: dates are dates, parcels are 1 to 3, weights are 5 to 50. Yet 30 handouts are dated before the household registered. Which kind of rule catches them?","options":[{"key":"A","text":"A stricter range on handout_date"},{"key":"B","text":"A rule across two fields: handout_date on or after registered_on"},{"key":"C","text":"A uniqueness rule on log_id"},{"key":"D","text":"No rule can: the values are all valid"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Some faults are invisible in any single column; consistency rules compare fields with each other, or one source with another.","misconceptions":["Tightens one column when the fault only exists between two","","Applies a rule about repeated rows to a fault of logic","Believes validity of each column is all a rule can express"],"lo":["LO4"],"day":4,"session":2,"slide":null,"level":"analyze","pool":"practice"},{"id":"q-lo4-every-build","type":"single","prompt":"Why do the rules run on every rebuild and not once, when the dataset is first made?","options":[{"key":"A","text":"Because the sources change: a branch can change its export next month"},{"key":"B","text":"Because rules slow the build, and a slow build is a careful one"},{"key":"C","text":"Because the first run of a rule is unreliable"},{"key":"D","text":"Because auditors count how many times rules were run"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"A rule protects the next build from a change nobody announced; a rule that ran once only describes the past.","misconceptions":["","Mistakes cost for value","Believes repetition makes a deterministic check more accurate","Treats rules as paperwork rather than as protection of the next answer"],"lo":["LO4"],"day":4,"session":1,"slide":null,"level":"understand","pool":"practice"},{"id":"q-lo4-clean-pass","type":"single","prompt":"You wrote a rule \"weight_kg between 5 and 50\" and it reports 4,000 failures on a build you believe is clean. What do you check first?","options":[{"key":"A","text":"Delete the rule: it is clearly too strict"},{"key":"B","text":"Widen the range until nothing fails"},{"key":"C","text":"Set the rule to a warning and move on"},{"key":"D","text":"The failing rows and their branches: a real fault and a wrong rule look the same until you read examples"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"A suite must pass on a clean build and fail on a corrupted one; when it fails, examples by owner tell you whether the data or the rule is wrong.","misconceptions":["Removes the alarm instead of finding out what it rang for","Fits the rule to the data, so it can never fail again","Keeps a rule nobody will read",""],"lo":["LO4"],"day":4,"session":1,"slide":null,"level":"analyze","pool":"practice"},{"id":"q-lo5-complete-case","type":"single","prompt":"Household size is missing for 18% of households, mostly large ones, and large households receive more parcels per visit. You drop the rows with no size. What happens to \"parcels per eligible household\"?","options":[{"key":"A","text":"It is unchanged: dropping rows only shrinks the sample"},{"key":"B","text":"It rises, because fewer households share the parcels"},{"key":"C","text":"It falls, because the households that receive most were removed"},{"key":"D","text":"It becomes undefined"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Complete-case analysis assumes the dropped households are like the rest; here they are larger and receive more, so the average of those left is too low.","misconceptions":["Assumes the dropped households resemble the kept ones","Forgets that the parcels of the dropped households leave the numerator too","","Believes any missing value prevents an estimate"],"lo":["LO5"],"day":3,"session":2,"slide":null,"level":"apply","pool":"practice"},{"id":"q-lo5-median","type":"single","prompt":"You replace every missing household size by the median, 5. The missing households are mostly of size 7 or more. What is the main cost?","options":[{"key":"A","text":"Nothing: the median is robust"},{"key":"B","text":"Large households are classified with a size of 5, so some truly eligible ones are counted as ineligible"},{"key":"C","text":"The median changes each time the code runs"},{"key":"D","text":"The dataset grows by 18%"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"A single value puts every missing household in the middle; a rule that depends on the size then misclassifies exactly the households the gap hides.","misconceptions":["Mistakes robustness to outliers for correctness of an imputed value","","Thinks a median is random","Confuses filling a field with adding rows"],"lo":["LO5"],"day":3,"session":2,"slide":null,"level":"analyze","pool":"practice"},{"id":"q-lo5-conditional","type":"single","prompt":"Branches hand out 1, 2 or 3 parcels per visit according to the family card. Which imputation of a missing household size uses that?","options":[{"key":"A","text":"The overall mean size, 5.3"},{"key":"B","text":"A size drawn at random between 1 and 14"},{"key":"C","text":"Zero, to be conservative"},{"key":"D","text":"The typical size of households that receive the same number of parcels per visit"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"An imputation should use what is observed and related to the missing value; parcels per visit carries information about the size.","misconceptions":["Ignores every observed fact about the household","Adds noise unrelated to the household","Uses an impossible value, and \"conservative\" has no direction here",""],"lo":["LO5"],"day":3,"session":2,"slide":null,"level":"apply","pool":"practice"},{"id":"q-lo5-range","type":"single","prompt":"Your best estimate is 2.06 parcels per eligible household per month. Under defensible assumptions about the missing sizes it ranges from 2.02 to 2.07, and the standard is 2.0. What do you report for the network as a whole?","options":[{"key":"A","text":"2.06, without the range: one number is clearer"},{"key":"B","text":"\"About 2.06 (2.02 to 2.07 under different assumptions about missing sizes): at or above the standard\""},{"key":"C","text":"\"Unknown\", because 18% of sizes are missing"},{"key":"D","text":"2.07, the most favourable value"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"When the whole range sits on one side of the decision line, say so and show the range; the reader sees both the estimate and how far it can move.","misconceptions":["Hides how much depends on an assumption","","Lets missing data veto a conclusion the whole range supports","Chooses the assumption by the answer it gives"],"lo":["LO5"],"day":3,"session":3,"slide":null,"level":"analyze","pool":"practice"},{"id":"q-lo5-flip","type":"single","prompt":"A district is at 1.97 under one imputation and 2.02 under another; the standard is 2.0. How does it appear in the report?","options":[{"key":"A","text":"Below the standard: 1.97 is the cautious figure"},{"key":"B","text":"At the standard: 2.02 rounds to 2"},{"key":"C","text":"As \"cannot be classified with these data\", with both values"},{"key":"D","text":"It is left out of the table"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"A district whose side of the line depends on the method is reported as undecided, with the values, so that nobody acts on an artefact of imputation.","misconceptions":["Picks one assumption and presents it as the finding","Picks the other assumption for the same reason","","Removes exactly the district where the uncertainty matters"],"lo":["LO5"],"day":3,"session":3,"slide":null,"level":"analyze","pool":"practice"},{"id":"q-lo6-plain-hash","type":"single","prompt":"A colleague replaces national ID numbers by their SHA-256 hash and calls the table anonymous. Someone holds a list of 40,000 ID numbers of residents. What can they do?","options":[{"key":"A","text":"Nothing: a hash cannot be reversed"},{"key":"B","text":"Hash their list and look each value up in the table"},{"key":"C","text":"Only identify people whose number begins with the same digit"},{"key":"D","text":"Decrypt the hashes with the SHA-256 key"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"A plain hash is the same for everyone who computes it; anyone with candidate identifiers can recompute and match them.","misconceptions":["Stops at \"one-way\" and misses that the same input always gives the same output","","Imagines a partial weakness where the match is exact","Thinks a plain hash has a key"],"lo":["LO6"],"day":4,"session":3,"slide":null,"level":"apply","pool":"practice"},{"id":"q-lo6-keyed","type":"single","prompt":"What makes a keyed hash (HMAC) hold where a plain hash fails?","options":[{"key":"A","text":"It is longer"},{"key":"B","text":"It uses a newer algorithm"},{"key":"C","text":"It cannot be recomputed without a key that is kept apart from the data"},{"key":"D","text":"It changes every time it is computed"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"The pseudonym depends on a secret; whoever lacks the key cannot test candidates, and the key is the additional information that must be kept separately.","misconceptions":["Attributes safety to output length","Looks for safety in the algorithm rather than in the secret","","Confuses a keyed hash with a random token; a pseudonym must be stable to link records"],"lo":["LO6"],"day":4,"session":3,"slide":null,"level":"understand","pool":"practice"},{"id":"q-lo6-still-personal","type":"single","prompt":"A table holds a keyed pseudonym, the district, the exact registration date and the household size. Is it still personal data?","options":[{"key":"A","text":"No: there is no name and no ID number in it"},{"key":"B","text":"No: a keyed hash is anonymisation"},{"key":"C","text":"Only if the key is lost"},{"key":"D","text":"Yes: pseudonymised data remain personal, and the other fields together can single a household out"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"Pseudonymised data can still be linked to a person with additional information, and a rare combination of ordinary fields can identify a household without any key.","misconceptions":["Equates personal data with direct identifiers","Confuses pseudonymisation with anonymisation","Reverses the role of the key: its existence is what keeps re-identification possible",""],"lo":["LO6"],"day":4,"session":3,"slide":null,"level":"analyze","pool":"practice"},{"id":"q-lo6-one-command","type":"single","prompt":"Which repository shows that a dataset is rebuildable?","options":[{"key":"A","text":"One that contains the final CSV and a notebook with saved outputs"},{"key":"B","text":"One with a README describing each manual step in order"},{"key":"C","text":"One whose single command turns the raw files into the dataset, its join log and its rule results"},{"key":"D","text":"One with the raw personal data committed for convenience"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Rebuildable means a command, not a description: the same raw files give the same dataset, with the counts and rule results produced by the run itself.","misconceptions":["Shows a result, not a way to produce it again","Relies on a person repeating steps exactly","","Publishes personal data in the name of reproducibility"],"lo":["LO6"],"day":4,"session":4,"slide":null,"level":"apply","pool":"practice"},{"id":"q-lo6-minimise","type":"single","prompt":"The question is \"parcels per eligible household per month, by district\". Which set of register fields do you request?","options":[{"key":"A","text":"Every field: unused columns can be dropped later"},{"key":"B","text":"household_id, district_id, registered_on, status, household_size, monthly_income_sar"},{"key":"C","text":"household_id and district_id only: everything else is personal"},{"key":"D","text":"national_id, head_name and district_id, to be sure who is who"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Each requested field has a step of the answer that needs it: the link, the group, the population and the eligibility rule; names and ID numbers have none.","misconceptions":["Collects first and justifies never","","Removes fields the answer cannot be computed without","Takes direct identifiers that no step of the answer uses"],"lo":["LO6"],"day":1,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"q-lo6-date-layout","type":"single","prompt":"A branch file holds dates such as 03/07/2026 and 11/04/2026. How do you decide whether the day or the month comes first?","options":[{"key":"A","text":"Let the library guess each value"},{"key":"B","text":"Assume day first: it is the local habit"},{"key":"C","text":"Look at all values of that branch: a first part above 12 anywhere settles it for the whole file"},{"key":"D","text":"Drop every date whose two parts are both 12 or less"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"The layout is a property of the source: one unambiguous value in the file decides for all, and the decision is logged per branch.","misconceptions":["Accepts a per-value guess that can read one file both ways","Replaces evidence by habit; two branches use donated software with month first","","Discards over a third of the rows for want of looking at the others"],"lo":["LO6"],"day":2,"session":4,"slide":null,"level":"analyze","pool":"practice"}]}</script>
